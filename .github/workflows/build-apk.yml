name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Make Executables
        run: |
          chmod +x android/gradlew
          chmod -R +x node_modules/react-native/sdks/hermesc/ || true

      - name: Build Android APK
        working-directory: android
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon > ../gradle_build.log 2>&1
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Release build failed with exit code $BUILD_STATUS. Trying assembleDebug..." >> ../gradle_build.log
            ./gradlew assembleDebug --no-daemon >> ../gradle_build.log 2>&1
            BUILD_STATUS=$?
          fi
          
          echo "## Gradle Output Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 ../gradle_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          exit $BUILD_STATUS

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 记账小宝-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
